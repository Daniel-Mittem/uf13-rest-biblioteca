services:
  mysql-db:
    image: mysql:9.0
    container_name: mysql_container
    environment:
      MYSQL_DATABASE: biblioteca_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - app-network

  spring-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca_app
    environment:
      DB_HOST: mysql-db
      DB_NAME: biblioteca_db
      DB_USER: root
      DB_PASSWORD: root
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      - mysql-db
    volumes:
      - ./logs:/var/log/biblioteca
    networks:
      - app-network

networks:
  app-network:
    driver: bridge