apiVersion: 1

groups:
  - orgId: 1
    name: biblioteca-alerts
    folder: Biblioteca
    interval: 30s
    rules:
      - uid: http-500-alert
        title: "Troppi errori HTTP 500"
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus-biblioteca
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: increase(http_server_requests_seconds_count{status="500"}[5m])
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
              refId: C
        labels:
          severity: critical
        annotations:
          summary: "Rilevati più di 10 errori HTTP 500 negli ultimi 5 minuti"